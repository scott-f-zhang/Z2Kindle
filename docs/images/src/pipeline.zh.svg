<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
    <style>
      .t{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif;font-size:30px;font-weight:700;fill:#1f2933}
      .c{font-family:Menlo,'SF Mono',Consolas,monospace;font-size:20px;fill:#37474f}
      .o{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif;font-size:21px;fill:#5f6b7a}
      .l{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif;font-size:22px;fill:#37474f}
      .script{fill:#eef2f7;stroke:#2d3e50;stroke-width:3}
      .agent{fill:#fff4e5;stroke:#d9822b;stroke-width:3;stroke-dasharray:12 7}
      .io{fill:#f5f5f5;stroke:#9e9e9e;stroke-width:3}
      .out{fill:#e8f5e9;stroke:#2e7d32;stroke-width:3}
      .ln{stroke:#37474f;stroke-width:3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="60" y="58" class="t" style="font-size:36px">Z2kindle 流程</text>
  <rect x="1010" y="30" width="34" height="24" class="script"/><text x="1054" y="50" class="l">脚本：每次结果一样</text>
  <rect x="1280" y="30" width="34" height="24" class="agent"/><text x="1324" y="50" class="l">Agent：需要判断</text>

  <!-- row 1 -->
  <rect x="60" y="110" width="300" height="170" rx="14" class="io"/>
  <text x="84" y="160" class="t">输入课件</text><text x="84" y="200" class="c">sources/</text><text x="84" y="240" class="o">.pdf / .pptx</text>

  <rect x="440" y="110" width="300" height="170" rx="14" class="script"/>
  <text x="464" y="160" class="t">① 提取</text><text x="464" y="200" class="c">tools/extract.py</text><text x="464" y="240" class="o">文字 + 每页预览图/高清图</text>

  <rect x="820" y="110" width="300" height="170" rx="14" class="agent"/>
  <text x="844" y="160" class="t">② 写阅读笔记</text><text x="844" y="200" class="c">prompts/summarize.md</text><text x="844" y="240" class="o">notes/*.md（含公式）</text>

  <rect x="1200" y="110" width="340" height="170" rx="14" class="agent"/>
  <text x="1224" y="160" class="t">③ 配图与排版</text><text x="1224" y="200" class="c">prompts/figures.md</text><text x="1224" y="240" class="o">figs/ + 版式 .full/.half/.side</text>

  <path d="M360 195H432" class="ln"/><path d="M740 195H812" class="ln"/><path d="M1120 195H1192" class="ln"/>
  <path d="M1370 280V330H210V372" class="ln"/>

  <!-- row 2 -->
  <rect x="60" y="380" width="300" height="170" rx="14" class="agent"/>
  <text x="84" y="430" class="t">③b 书本版（可选）</text><text x="84" y="470" class="c">prompts/book.md</text><text x="84" y="510" class="o">notes_book/*.md</text>

  <rect x="440" y="380" width="300" height="170" rx="14" class="script"/>
  <text x="464" y="430" class="t">校验</text><text x="464" y="470" class="c">tools/check.py</text><text x="464" y="510" class="o">图号、引用、公式、繁体字</text>

  <rect x="820" y="380" width="300" height="170" rx="14" class="script"/>
  <text x="844" y="430" class="t">④ 构建</text><text x="844" y="470" class="c">build/build.js</text><text x="844" y="510" class="o">公式→图片、封面、元数据</text>

  <rect x="1200" y="380" width="340" height="170" rx="14" class="out"/>
  <text x="1224" y="430" class="t">成品</text><text x="1224" y="470" class="c">output/*.epub</text><text x="1224" y="510" class="o">→ Send to Kindle</text>

  <path d="M360 465H432" class="ln"/><path d="M740 465H812" class="ln"/><path d="M1120 465H1192" class="ln"/>

  <rect x="820" y="610" width="300" height="110" rx="14" class="script" style="stroke-dasharray:4 6"/>
  <text x="844" y="655" class="t" style="font-size:26px">网页预览（可选）</text><text x="844" y="695" class="c">work/web/&lt;版本&gt;/</text>
  <path d="M970 550V602" class="ln" style="stroke-dasharray:6 6"/>
  <text x="60" y="650" class="l">配置：book.yaml（书名、设备、封面、元数据、版本）</text>
  <text x="60" y="690" class="l">中间结果：work/　成品：output/</text>
</svg>
