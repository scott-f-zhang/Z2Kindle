# Book project config for Z2kindle. Paths are relative to this file.
title: Demo Slides · Reading Notes
subtitle: Z2kindle demo
language: en                # en (default) or zh-CN; picks prompts/en or prompts/zh
device: scribe-11           # see profiles/devices.yaml

sources: sources            # folder with .pdf / .pptx slide decks
notes: notes                # chapter markdown (one file per source, same stem)
front: front/preface.md     # optional; shown before chapter list / as first EPUB chapter
cover:
  heading: Demo Slides
  subheading: Reading Notes
  tagline: Demo · formulas and figures
  footer: Typeset for Kindle Scribe

# Optional explicit chapter order (source file stems). Default: natural sort by the
# first number in the file name.
# chapters: [L6_Classification, L7_Logistic_regression]

metadata:                   # embedded in the EPUB; all fields optional
  author: Demo Author
  date: 2026-01-15
  publisher: Z2kindle
  description: The demo book bundled with Z2kindle, showing formulas, figures and multi-edition builds.
  subject: [demo, logistic regression]
  rights: Demo content, free to use

output_name: demo-notes     # -> output/demo-notes.epub
web: true                   # also build the web preview (work/web/main/)

# Another edition of the same project: same sources/figs, its own notes, language and cover.
# Here a Simplified Chinese edition, built to output/demo-notes-zh.epub. (A book-style rewrite
# would be added the same way, e.g. `book: {notes: notes_book, ...}`.)
editions:
  zh:
    language: zh-CN
    title: 演示幻灯片 · 阅读笔记
    subtitle: Z2kindle 示例
    notes: notes_zh
    front: front/preface_zh.md
    cover: {heading: 演示幻灯片, subheading: 阅读笔记, tagline: 示例 · 图文公式完整, footer: 为 Kindle Scribe 排版}
    metadata:
      author: 示例作者
      description: Z2kindle 自带的示例书，演示公式、配图和多版本构建。
      subject: [示例, 逻辑回归]
      rights: 示例内容，可自由使用
